[workspace]
members = [
    "crates/core-math",
    "crates/geo-kernel",
    "crates/geo-nodes",
    "crates/graph-engine",
    "crates/render-pathtracer",
    "crates/render-viewport",
    "crates/app",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.19", features = ["derive"] }
slotmap = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
smallvec = "1.13"
rhai = "1.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# Crates within workspace
core-math = { path = "crates/core-math" }
geo-kernel = { path = "crates/geo-kernel" }
geo-nodes = { path = "crates/geo-nodes" }
graph-engine = { path = "crates/graph-engine" }
render-pathtracer = { path = "crates/render-pathtracer" }
render-viewport = { path = "crates/render-viewport" }

# Viewport & Graphics
wgpu = "22.0"
winit = "0.30"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
pollster = "0.4"
