[workspace]
members = [
    "crates/core-math",
    "crates/geo-kernel",
    "crates/geo-nodes",
    "crates/graph-engine",
    "crates/render-pathtracer",
    "crates/render-viewport",
    "crates/app",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.19", features = ["derive"] }
slotmap = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
smallvec = "1.13"
rhai = "1.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# Crates within workspace
core-math = { path = "crates/core-math" }
geo-kernel = { path = "crates/geo-kernel" }
geo-nodes = { path = "crates/geo-nodes" }
graph-engine = { path = "crates/graph-engine" }
render-pathtracer = { path = "crates/render-pathtracer" }
render-viewport = { path = "crates/render-viewport" }

# Viewport & Graphics
wgpu = "22.0"
winit = "0.30"
egui = "0.29"
egui_dock = { version = "0.14", features = ["serde"] }
egui-wgpu = "0.29"
egui-winit = "0.29"
pollster = "0.4"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
empty_line_after_doc_comments = "allow"
needless_range_loop = "allow"
if_same_then_else = "allow"
explicit_counter_loop = "allow"
inherent_to_string = "allow"
non_canonical_partial_ord_impl = "allow"
let_and_return = "allow"
collapsible_if = "allow"
unnecessary_unwrap = "allow"
manual_clamp = "allow"
field_reassign_with_default = "allow"
useless_format = "allow"
while_let_loop = "allow"
large_enum_variant = "allow"
