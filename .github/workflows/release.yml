name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: plumb3d
            asset_name: plumb3d-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: plumb3d.exe
            asset_name: plumb3d-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: plumb3d
            asset_name: plumb3d-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/app staging/${{ matrix.artifact_name }}
          cp README.md CHANGELOG.md staging/
          tar -czf ${{ matrix.asset_name }} -C staging .

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item target/${{ matrix.target }}/release/app.exe staging/${{ matrix.artifact_name }}
          Copy-Item README.md, CHANGELOG.md staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
